<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510"><rect width="880" height="510" rx="24" fill="#eef6f7"/><g font-family="DejaVu Sans, sans-serif"><text x="42" y="58" font-size="34" fill="#132b43" font-weight="700">Where is the encoder mounted?</text><text x="42" y="104" font-size="22" fill="#132b43">Same 2,000 X4 counts per encoder turn.</text><rect x="42" y="137" width="796" height="160" rx="18" fill="white" stroke="#c7d9df" stroke-width="2"/><text x="64" y="177" font-size="30" fill="#132b43" font-weight="700">Direct output encoder</text><text x="64" y="216" font-size="22" fill="#132b43">1 encoder turn per output turn</text><text x="64" y="264" font-size="23" fill="#58409a" font-weight="700">2,000 counts / output turn</text><text x="519" y="264" font-size="25" fill="#006b68" font-weight="700">0.180° / count</text><rect x="42" y="320" width="796" height="160" rx="18" fill="white" stroke="#c7d9df" stroke-width="2"/><text x="64" y="360" font-size="30" fill="#132b43" font-weight="700">Motor encoder before reduction</text><text x="64" y="399" font-size="22" fill="#132b43">12 encoder turns per output turn</text><text x="64" y="447" font-size="23" fill="#58409a" font-weight="700">24,000 counts / output turn</text><text x="519" y="447" font-size="25" fill="#006b68" font-weight="700">0.015° / count</text></g></svg>
